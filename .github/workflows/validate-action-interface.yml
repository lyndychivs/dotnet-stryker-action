name: validate-action-interface
run-name: Validate Action Interface

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-action-interface:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Sample Tests
        run: |
          set -euo pipefail
          dotnet test tests/Sample.slnx --configuration Release

      - name: Run Local Action
        id: stryker
        uses: ./
        with:
          configFile: tests/stryker-config.json
          strykerArgs: "--reporter markdown --reporter json --verbosity info --break-on-initial-test-failure"

      - name: Verify Outputs
        run: |
          set -euo pipefail

          test -n "${{ steps.stryker.outputs.reportDirectory }}"
          test -n "${{ steps.stryker.outputs.markdownSummaryPath }}"
          test -n "${{ steps.stryker.outputs.jsonReportPath }}"
          test -n "${{ steps.stryker.outputs.mutationScore }}"
          test "${{ steps.stryker.outputs.thresholdStatus }}" = "passed"

          test -f "${{ steps.stryker.outputs.markdownSummaryPath }}"
          test -f "${{ steps.stryker.outputs.jsonReportPath }}"
