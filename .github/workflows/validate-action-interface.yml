name: validate-action-interface
run-name: Validate Action Interface

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-action-interface:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify checked-in sample solution
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/Sample.sln
          test -f tests/Sample/Sample.csproj
          test -f tests/Sample/Calculator.cs
          test -f tests/Sample.Unit.Tests/Sample.Unit.Tests.csproj
          test -f tests/Sample.Unit.Tests/CalculatorTests.cs
          test -f tests/stryker-config.json

      - name: Run sample tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Sample.sln --configuration Release

      - name: Run local action
        id: stryker
        uses: ./
        with:
          configurationFile: tests/stryker-config.json
          reporters: markdown,json
          verbosity: info
          cliArgs: --break-on-initial-test-failure

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          test -n "${{ steps.stryker.outputs.reportDirectory }}"
          test -n "${{ steps.stryker.outputs.markdownSummaryPath }}"
          test -n "${{ steps.stryker.outputs.jsonReportPath }}"
          test -n "${{ steps.stryker.outputs.mutationScore }}"

          test -f "${{ steps.stryker.outputs.markdownSummaryPath }}"
          test -f "${{ steps.stryker.outputs.jsonReportPath }}"
