name: "dotnet-stryker-action"
description: "GitHub Action for mutation testing with Stryker.NET via Docker"
author: "lyndychivs"

branding:
  icon: "crosshair"
  color: "red"

inputs:
  configFile:
    description: "Choose the file containing your Stryker configuration. Supports json and yaml formats. Optional; Stryker falls back to stryker-config.json when omitted."
    required: false
    default: ""

  strykerArgs:
    description: "Additional Stryker CLI arguments appended last to the dotnet-stryker command."
    required: false
    default: ""

  reporters:
    description: "Reporters inform about various stages in the mutation test run. Provide a comma-separated list that becomes repeated --reporter flags."
    required: false
    default: ""

  output:
    description: "Changes the output path for Stryker logs and reports. This can be an absolute or relative path."
    required: false
    default: ""

  thresholdHigh:
    description: "Minimum good mutation score. Must be higher than or equal to threshold low. Allowed values: 0 - 100."
    required: false
    default: ""

  thresholdLow:
    description: "Minimum acceptable mutation score. Must be less than or equal to threshold high and more than or equal to threshold break. Allowed values: 0 - 100."
    required: false
    default: ""

  breakAt:
    description: "Anything below this mutation score will return a non-zero exit code. Must be less than or equal to threshold low. Allowed values: 0 - 100."
    required: false
    default: ""

  since:
    description: "Enables diff compare. Only test changed files. Use true for the default behavior or provide a committish target as --since:<committish>."
    required: false
    default: ""

  withBaseline:
    description: "EXPERIMENTAL: Use results stored in the Stryker dashboard to only test new mutants. Use true for the default behavior or provide a committish target as --with-baseline:<committish>."
    required: false
    default: ""

  verbosity:
    description: "The verbosity for output to the console. Allowed values: error, warning, info, debug, trace."
    required: false
    default: ""

  showEffectiveCommand:
    description: "When true, print the assembled dotnet-stryker command with secret values redacted."
    required: false
    default: "false"

  writeStepSummary:
    description: "When true, write a GitHub step summary from generated report artifacts when available."
    required: false
    default: "true"

outputs:
  mutationScore:
    description: "The final mutation score percentage when it could be derived from generated reports."
  thresholdStatus:
    description: "Threshold evaluation result: passed, failed, or empty when it could not be derived."
  reportDirectory:
    description: "The latest Stryker reports directory if one was generated."
  htmlReportPath:
    description: "Path to the generated HTML report when present."
  jsonReportPath:
    description: "Path to the generated JSON report when present."
  markdownSummaryPath:
    description: "Path to the generated Markdown summary report when present."

runs:
  using: "docker"
  image: "Dockerfile"
